name: DrawNCut
options:
  bundleIdPrefix: com.alimomeni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: V9DBGV72NL
  configs:
    # The trace pipeline is heavy numeric Swift; unoptimized it takes tens of
    # seconds per page. Keep -O in Debug so on-device testing feels real.
    debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      # Single self-contained binary; the debug-dylib split breaks
      # command-line simctl installs when products go stale.
      ENABLE_DEBUG_DYLIB: "NO"
targets:
  DrawNCut:
    type: application
    platform: iOS
    sources:
      - DrawNCut
      # Real-photo fixture bundled for the DEMO_IMAGE=bundled: test hook.
      - path: Fixtures
        buildPhase: resources
        includes:
          - "fish-photo.jpg"
      # SAM 2 weights (~94 MB, populated by scripts/download-models.sh —
      # they are git-ignored, so a fresh checkout must run it before
      # building). Dev-build shipping choice; App Store slimming via
      # first-run download is a later task (INTEGRATION.md option 1).
      # buildPhase sources → Xcode precompiles each .mlpackage to .mlmodelc
      # in the bundle root, which SAM2Segmenter prefers over recompiling.
      - path: Models
        buildPhase: sources
        includes:
          - "*.mlpackage"
    info:
      path: DrawNCut/Info.plist
      properties:
        CFBundleDisplayName: Draw'n'Cut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Draw'n'Cut uses the camera to photograph drawings so they can be traced and laser cut.
        NSPhotoLibraryUsageDescription: Draw'n'Cut can import existing photos of drawings from your photo library.
        # Registers .dxf so exports keep their extension and icon everywhere
        # (share sheet, Files, AirDrop).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.alimomeni.drawncut.dxf
            UTTypeDescription: DXF Drawing
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - dxf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alimomeni.drawncut
        # The SAM2Segmenter wrapper loads models by URL; generated model
        # classes would only add compile time.
        COREML_CODEGEN_LANGUAGE: None
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9DBGV72NL
  DrawNCutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DrawNCutTests
      - path: Fixtures
        buildPhase: resources
        includes:
          - "*.png"
          - "*.jpg"
    dependencies:
      - target: DrawNCut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  DrawNCutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DrawNCutUITests
    dependencies:
      - target: DrawNCut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  DrawNCut:
    build:
      targets:
        DrawNCut: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DrawNCutTests
        - DrawNCutUITests
