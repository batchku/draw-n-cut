name: DrawNCut
options:
  bundleIdPrefix: com.alimomeni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: false
  configs:
    # The trace pipeline is heavy numeric Swift; unoptimized it takes tens of
    # seconds per page. Keep -O in Debug so on-device testing feels real.
    debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      # Single self-contained binary; the debug-dylib split breaks
      # command-line simctl installs when products go stale.
      ENABLE_DEBUG_DYLIB: "NO"
targets:
  DrawNCut:
    type: application
    platform: iOS
    sources:
      - DrawNCut
    info:
      path: DrawNCut/Info.plist
      properties:
        CFBundleDisplayName: Draw'n'Cut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Draw'n'Cut uses the camera to photograph drawings so they can be traced and laser cut.
        NSPhotoLibraryUsageDescription: Draw'n'Cut can import existing photos of drawings from your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alimomeni.drawncut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9DBGV72NL
  DrawNCutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DrawNCutTests
      - path: Fixtures
        buildPhase: resources
        includes:
          - "*.png"
    dependencies:
      - target: DrawNCut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  DrawNCut:
    build:
      targets:
        DrawNCut: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DrawNCutTests
